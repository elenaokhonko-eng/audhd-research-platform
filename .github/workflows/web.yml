# M1 website: test on every pull request, deploy to dev on every push to main,
# promote the same image to prod when a v* tag is pushed.
name: web

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token Workload Identity exchanges

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.REGISTRY }}/web:${{ github.sha }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type-checks every page
      - name: Smoke test the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=8080 HOSTNAME=127.0.0.1 SITE_ENV=dev node server.js &)
          sleep 3
          for p in / /research-agenda /evidence-library /clinician-resources /methods /about-elena-okhonko /member /ask /api/healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")
            echo "$p $code"; test "$code" = 200
          done

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" apps/web && docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@v2
        id: deploy
        with:
          service: web-dev
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.RUNTIME_SA }}
      - run: curl -fsS "${{ steps.deploy.outputs.url }}/api/healthz"

  deploy-prod:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # add yourself as a required reviewer on this environment
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reuse the image built on main, or build it
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            docker build -t "$IMAGE" apps/web && docker push "$IMAGE"
          fi
      - uses: google-github-actions/deploy-cloudrun@v2
        id: deploy
        with:
          service: web-prod
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.RUNTIME_SA }}
      - run: curl -fsS "${{ steps.deploy.outputs.url }}/api/healthz"
