# M1 website: test on every pull request. Deploy to the dev project on every push to
# integration/stage-1, or a manual run (workflow_dispatch) on that branch, once the owner has
# switched dev deploys on (Gate 1), and to prod when a v* tag is pushed and the owner
# approves. Each deploy job reads GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOYER_SA,
# RUNTIME_SA and REGISTRY from its GitHub environment (dev or production), which
# ops/scripts/20-stage1-foundations.sh fills from Terraform's outputs.
name: web

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  push:
    branches: [main, "integration/**"]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token Workload Identity exchanges

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type-checks every page
      - name: The legal texts are in the standalone output
        run: |
          for f in terms privacy; do
            test -f ".next/standalone/content/legal/$f.md" || {
              echo "::error::.next/standalone/content/legal/$f.md is missing: /terms and /privacy would fail in the image. Keep content/legal in the build's output file tracing (next.config.ts, outputFileTracingIncludes)."
              exit 1
            }
          done
      - name: Smoke test the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=8080 HOSTNAME=127.0.0.1 SITE_ENV=dev node server.js &)
          sleep 3
          for p in / /research-agenda /evidence-library /clinician-resources /methods /about-elena-okhonko /ask /api/healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")
            echo "$p $code"; test "$code" = 200
          done
          # The workspace is behind a server guard: without a session it answers 200 (before the
          # guard existed) or a redirect to the join page (after). Anything else is a failure.
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:8080/member")
          echo "/member $out"
          case "$out" in
            "200 "*) ;;
            "307 "*/join*) ;;
            *) exit 1 ;;
          esac

  # Only integration/stage-1 deploys to dev, so the daily promotion to main does not deploy a
  # second time. A manual run on that branch redeploys without a new commit. DEPLOY_DEV_ENABLED
  # is a variable of the environment dev, which a job-level condition cannot see (the
  # environment's variables are available to steps only), so the check is the first step and
  # every later step depends on it.
  deploy-dev:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/integration/stage-1'
    needs: build-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Dev deploys switched on (DEPLOY_DEV_ENABLED on environment dev)
        id: gate
        run: |
          if [ "${{ vars.DEPLOY_DEV_ENABLED == 'true' }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dev deploys are off until Gate 1. Nothing deployed."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        name: Image name
        run: |
          echo "REGION=${{ vars.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ vars.REGISTRY }}/web:${{ github.sha }}" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.gate.outputs.enabled == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - if: steps.gate.outputs.enabled == 'true'
        run: docker build -t "$IMAGE" apps/web && docker push "$IMAGE"
      - if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        id: deploy
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: web-dev
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.RUNTIME_SA }}
      - if: steps.gate.outputs.enabled == 'true'
        run: curl -fsS "${{ steps.deploy.outputs.url }}/api/healthz"

  deploy-prod:
    # The prod deployer accepts only jobs in the environment production on a v* tag
    # (infra/terraform/envs/prod/identities.tf).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    environment: production # the owner is the required reviewer of this environment
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          echo "REGION=${{ vars.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ vars.REGISTRY }}/web:${{ github.sha }}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reuse the image if this commit is already in the prod registry, or build it
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            docker build -t "$IMAGE" apps/web && docker push "$IMAGE"
          fi
      - uses: google-github-actions/deploy-cloudrun@v2
        id: deploy
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: web-prod
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.RUNTIME_SA }}
      - run: curl -fsS "${{ steps.deploy.outputs.url }}/api/healthz"
