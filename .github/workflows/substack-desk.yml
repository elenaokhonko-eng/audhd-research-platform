# substack-desk package: lint, type-check and test on every pull request that touches it.
name: substack-desk

on:
  pull_request:
    paths: ["packages/substack-desk/**", ".github/workflows/substack-desk.yml"]
  push:
    branches: [main, "integration/**"]
    paths: ["packages/substack-desk/**", ".github/workflows/substack-desk.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/substack-desk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -v
