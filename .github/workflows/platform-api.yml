# platform-api: test on every pull request that touches the service, whatever its target branch.
# Deploy the image to the dev project on every push to integration/stage-1, or a manual run
# (workflow_dispatch) on that branch, once the owner has switched dev deploys on (Gate 1), and
# to prod when a v* tag is pushed and the owner approves. One image serves platform-api
# (PLATFORM_APP_MODE=api), platform-hooks (hooks) and the jobs platform-selfcheck, stripe-reconcile
# and roster-import (platform-cli job <name>); a job that Terraform has not created yet is skipped
# with a notice. The deploy changes only the image; every other setting of the services and the
# jobs belongs to Terraform. Each deploy job reads GCP_PROJECT_ID, GCP_REGION,
# WIF_PROVIDER, DEPLOYER_SA and REGISTRY from its GitHub environment (dev or production),
# which ops/scripts/20-stage1-foundations.sh fills from Terraform's outputs.
name: platform-api

on:
  pull_request:
    paths: ["services/platform-api/**", "packages/substack-desk/**", ".github/workflows/platform-api.yml"]
  push:
    branches: [main, "integration/**"]
    paths: ["services/platform-api/**", "packages/substack-desk/**", ".github/workflows/platform-api.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32" # the same uv as the Dockerfile
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/platform-api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration"
      # GitHub service containers cannot take a command, so the emulator starts in a step.
      # The emulator image is pinned to a gcloud release; bump it deliberately.
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:594.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8085; then
              echo "Firestore emulator answers after ${i}s."; exit 0
            fi
            sleep 1
          done
          echo "::error::The Firestore emulator did not answer on port 8085 within 60 seconds."
          docker logs firestore-emulator
          exit 1
      - run: uv run pytest -m integration
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085

  # Builds the committed Dockerfile unchanged on every run and smoke-tests the image the way
  # the deploy jobs will use it: hooks mode over HTTP, and the job entry point.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/platform-api/Dockerfile -t platform-api:ci .
      - name: The substack-desk package is in the image
        run: docker run --rm platform-api:ci python -c "import substack_desk"
      - name: Smoke test the image
        run: |
          docker run -d --name pa -e PLATFORM_APP_MODE=hooks -p 8080:8080 platform-api:ci
          body=""
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8080/health 2>/dev/null); then break; fi
            body=""; sleep 1
          done
          echo "health: ${body}"
          echo "$body" | grep -q '"mode":"hooks"' || { echo "::error::/health did not answer in hooks mode within 30 seconds."; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/ping)
          echo "/v1/ping in hooks mode: ${code}"
          test "$code" = 404 || { echo "::error::/v1/ping answered ${code} in hooks mode, expected 404."; exit 1; }
      - name: Job entry point exists
        run: docker run --rm platform-api:ci platform-cli --help
      - name: Container logs
        if: failure()
        run: docker logs pa || true
      - name: Stop the container
        if: always()
        run: docker rm -f pa || true

  # Only integration/stage-1 deploys to dev, so the daily promotion to main does not deploy a
  # second time. A manual run on that branch redeploys without a new commit. DEPLOY_DEV_ENABLED
  # is a variable of the environment dev, which a job-level condition cannot see (the
  # environment's variables are available to steps only), so the check is the first step and
  # every later step depends on it.
  deploy-dev:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/integration/stage-1'
    needs: [test, image]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token Workload Identity exchanges
    steps:
      - name: Dev deploys switched on (DEPLOY_DEV_ENABLED on environment dev)
        id: gate
        run: |
          if [ "${{ vars.DEPLOY_DEV_ENABLED == 'true' }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dev deploys are off until Gate 1. Nothing deployed."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        name: Image name
        run: |
          echo "PROJECT=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "REGION=${{ vars.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ vars.REGISTRY }}/platform-api:${{ github.sha }}" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - if: steps.gate.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.gate.outputs.enabled == 'true'
        name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f services/platform-api/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"
      - if: steps.gate.outputs.enabled == 'true'
        name: Deploy the image (only the image changes)
        run: |
          for svc in platform-api platform-hooks; do
            gcloud run deploy "$svc" --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
          done
          gcloud run jobs update platform-selfcheck --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
          # The launch jobs exist once the owner has applied wave 2's Terraform; until then they are skipped.
          for job in stripe-reconcile roster-import; do
            if err="$(gcloud run jobs describe "$job" --region="$REGION" --project="$PROJECT" --format='value(name)' 2>&1 >/dev/null)"; then
              gcloud run jobs update "$job" --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
            elif grep -qiE 'cannot find|not found' <<<"$err"; then
              echo "::notice::The job $job does not exist in $PROJECT yet (wave 2's Terraform is not applied there); its image was not updated."
            else
              echo "::error::Could not read the job $job in $PROJECT: $err"
              exit 1
            fi
          done

  deploy-prod:
    # The prod deployer accepts only jobs in the environment production on a v* tag
    # (infra/terraform/envs/prod/identities.tf).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, image]
    runs-on: ubuntu-latest
    environment: production # the owner is the required reviewer of this environment
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token Workload Identity exchanges
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          echo "PROJECT=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "REGION=${{ vars.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ vars.REGISTRY }}/platform-api:${{ github.sha }}" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reuse the image if this commit is already in the prod registry, or build it
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            docker build -f services/platform-api/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"
          fi
      - name: Deploy the image (only the image changes)
        run: |
          for svc in platform-api platform-hooks; do
            gcloud run deploy "$svc" --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
          done
          gcloud run jobs update platform-selfcheck --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
          # The launch jobs exist once the owner has applied wave 2's Terraform; until then they are skipped.
          for job in stripe-reconcile roster-import; do
            if err="$(gcloud run jobs describe "$job" --region="$REGION" --project="$PROJECT" --format='value(name)' 2>&1 >/dev/null)"; then
              gcloud run jobs update "$job" --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
            elif grep -qiE 'cannot find|not found' <<<"$err"; then
              echo "::notice::The job $job does not exist in $PROJECT yet (wave 2's Terraform is not applied there); its image was not updated."
            else
              echo "::error::Could not read the job $job in $PROJECT: $err"
              exit 1
            fi
          done
