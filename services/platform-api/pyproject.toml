[project]
name = "platform-api"
version = "0.1.0"
description = "audhdneurobiology.org platform backend: membership, commerce, library"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "google-auth",
    "requests",
    "stripe",
    "firebase-admin",
    "google-cloud-kms",
    "google-cloud-storage",
    "google-cloud-run",
    "google-cloud-secret-manager",
    "pyyaml",
    "httpx",
    "substack-desk",
]

[tool.uv.sources]
substack-desk = { path = "../../packages/substack-desk", editable = true }

[project.scripts]
platform-cli = "platform_api.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.mypy]
strict = true
packages = ["platform_api"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real emulators or cloud; excluded from the default run"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
